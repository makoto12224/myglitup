<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>講習終了後アンケート</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <style>
    :root{ --brand:#0ea5a4; --ink:#222; --muted:#666; --bg:#fff; --border:#e5e7eb; --star:#f5b301; --star-off:#cfcfcf; }
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,Arial,sans-serif;margin:20px;line-height:1.6;color:var(--ink);background:var(--bg)}
    h1{ text-align:center; font-size:22px; margin:0 0 6px }
    .lead{ text-align:center; font-size:14px; color:var(--muted); margin:0 0 20px }
    .question{ margin-bottom:18px }
    label.q{ display:block; font-weight:600; margin-bottom:6px }/* ★ スター（ラジオ＋ラベル）: JSなしでも表示される安全版 */
.stars{ display:flex; align-items:center; gap:8px; font-size:26px; user-select:none }
.star-input{ position:absolute; left:-9999px; }
.star-label{ color:var(--star-off); cursor:pointer; transition:transform .05s ease }
.star-label:active{ transform:scale(.96) }
.star-label.selected{ color:var(--star) }

textarea{ width:100%; min-height:90px; border:1px solid var(--border); border-radius:8px; padding:10px }
.row{ display:flex; justify-content:center; margin-top:16px }
.btn{ display:inline-flex; align-items:center; gap:8px; padding:12px 16px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(14,165,164,.22) }
.btn:hover{ filter:brightness(.95) }
.thanks{ text-align:center; margin-top:18px; font-weight:700 }
#summary{ display:none }
table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px }
th,td{ border:1px solid #ddd; padding:8px; vertical-align:top }
th{ width:38%; background:#f7f7f7; text-align:left }
.note{ color:var(--muted); font-size:12px; margin-top:6px; text-align:center }
details.test{ margin:20px 0; border:1px dashed var(--border); border-radius:10px; padding:10px }

/* 印刷フォールバック用：summaryだけ印刷 */
@media print{ body.print-summary *{ display:none !important } body.print-summary #summary{ display:block !important } }

  </style>
</head>
<body>

<div class="question">

<div class="row">

  </form>  <div class="thanks">ご協力ありがとうございました。</div>
  <p class="note">※ PDF保存がうまくいかない場合は、テスト欄の「フォールバック強制」をお試しください。</p>  <section id="summary" aria-hidden="true"></section>  <details class="test">
    <summary>開発者向けテスト</summary>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0;">
      <button type="button" id="runTests" class="btn" style="padding:8px 12px; font-weight:600;">テストを実行</button>
      <button type="button" id="dryRun" class="btn" style="padding:8px 12px; font-weight:600; background:#6366f1;">ダミーデータでPDF生成テスト</button>
      <label style="display:inline-flex; align-items:center; gap:6px;">
        <input type="checkbox" id="forceFallback"> html2pdf を使わずフォールバック強制
      </label>
    </div>
    <div id="testLog" style="font-family:ui-monospace, Menlo, Consolas; font-size:12px; white-space:pre-wrap; background:#fafafa; border:1px solid #eee; border-radius:8px; padding:8px;"></div>
  </details>  <script>
    const sleep = (ms)=> new Promise(r=>setTimeout(r, ms));
    async function waitForPaint(extraMs=120){
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(_){} }
      if(extraMs>0) await sleep(extraMs);
    }

    // ★ ラジオ版スターの選択状態を見た目に反映
    function refreshStarsVisual(container){
      const inputs = Array.from(container.querySelectorAll('.star-input'));
      const labels = Array.from(container.querySelectorAll('.star-label'));
      const checked = inputs.find(i=>i.checked);
      const score = checked ? Number(checked.value) : 0;
      labels.forEach((lab, idx)=>{
        lab.classList.toggle('selected', idx < score);
      });
    }

    function initStarRadios(){
      document.querySelectorAll('.stars').forEach(container=>{
        refreshStarsVisual(container);
        container.addEventListener('change', ()=>refreshStarsVisual(container));
        // キーボードでの操作補助（左右キー）
        container.addEventListener('keydown', e=>{
          if(e.target.classList.contains('star-input')){
            const inputs = Array.from(container.querySelectorAll('.star-input'));
            const idx = inputs.indexOf(e.target);
            if(e.key==='ArrowRight' && idx < inputs.length-1){ inputs[idx+1].checked = true; inputs[idx+1].dispatchEvent(new Event('change', {bubbles:true})); }
            if(e.key==='ArrowLeft' && idx > 0){ inputs[idx-1].checked = true; inputs[idx-1].dispatchEvent(new Event('change', {bubbles:true})); }
          }
        });
      });
    }

    function buildSummary(){
      let html = '<h2 style="margin:0 0 8px">アンケート結果（要約）</h2>';
      html += '<table>';
      document.querySelectorAll('.stars').forEach(box=>{
        const label = box.previousElementSibling?.innerText || '';
        const checked = box.querySelector('.star-input:checked');
        const score = checked ? checked.value : '—';
        html += `<tr><th>${label}</th><td>${score}</td></tr>`;
      });
      const remark=document.getElementById('remark').value;
      html += `<tr><th>備考</th><td>${remark ? remark.replace(/\n/g,'<br>') : '—'}</td></tr>`;
      html += '</table>';
      const s = document.getElementById('summary');
      s.innerHTML = html;
      return s;
    }

    function loadScript(src){
      return new Promise((resolve,reject)=>{
        const el = document.createElement('script');
        el.src = src; el.async = true; el.onload = ()=>resolve(true); el.onerror = ()=>reject(new Error('load fail'));
        document.head.appendChild(el);
      });
    }
    async function ensureHtml2Pdf(){
      if(window.html2pdf) return true;
      try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'); }catch(e){}
      if(window.html2pdf) return true;
      try{ await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'); }catch(e){}
      return !!window.html2pdf;
    }

    function printSummary(){
      const s = buildSummary();
      const prevDisp = s.style.display; s.style.display = 'block';
      document.body.classList.add('print-summary');
      window.print();
      document.body.classList.remove('print-summary');
      s.style.display = prevDisp || '';
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
    }

    async function saveAsPDF(){
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; const prevLabel = btn.textContent; btn.textContent = '生成中…'; btn.setAttribute('aria-busy','true');

      const summaryEl = buildSummary();
      const prevDisp = summaryEl.style.display; summaryEl.style.display = 'block';

      await waitForPaint(160);
      if(summaryEl.offsetHeight === 0){ await waitForPaint(240); }

      const forceFallback = document.getElementById('forceFallback')?.checked;
      let canUseLib = !forceFallback && await ensureHtml2Pdf();

      const opt={
        margin:10,
        filename: `講習アンケート_${new Date().toISOString().slice(0,10)}.pdf`,
        image:{type:'jpeg',quality:0.98},
        html2canvas:{scale:2,useCORS:true, scrollY: 0},
        jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
      };

      if(canUseLib){
        try{ await html2pdf().from(summaryEl).set(opt).save(); }
        catch(e1){
          try{ const blob = await html2pdf().from(summaryEl).set(opt).outputPdf('blob'); downloadBlob(blob, opt.filename); }
          catch(e2){ console.warn('html2pdf 失敗。印刷へフォールバックします。', e1, e2); printSummary(); }
        }
      }else{ printSummary(); }

      summaryEl.style.display = prevDisp || '';
      btn.disabled = false; btn.textContent = prevLabel; btn.removeAttribute('aria-busy');
    }

    function log(msg){ const el=document.getElementById('testLog'); el.textContent += (msg+"\n"); }
    function clearLog(){ const el=document.getElementById('testLog'); el.textContent=''; }
    function runTests(){
      clearLog();
      try{
        const boxes = document.querySelectorAll('.stars');
        log(`質問数: ${boxes.length}（期待: 8） -> ${boxes.length===8?'OK':'NG'}`);

        // すべて★3チェック
        document.querySelectorAll('.star-input[value="3"]').forEach(i=>{ i.checked=true; i.dispatchEvent(new Event('change', {bubbles:true})); });
        const s = buildSummary();
        const has3 = (s.innerHTML.match(/>3<\/td>/g)||[]).length;
        log(`★3の反映数: ${has3}（期待: 8） -> ${has3===8?'OK':'NG'}`);
        const remark = document.getElementById('remark');
        remark.value = '改行A\n改行B';
        const s2 = buildSummary();
        log(`備考の改行→<br> への変換: ${/改行A<br>改行B/.test(s2.innerHTML)?'OK':'NG'}`);

        log(`html2pdf 存在: ${!!window.html2pdf}`);
        log('テスト完了');
      }catch(e){ log('テスト中エラー: '+e.message); }
    }

    async function dryRun(){
      clearLog();
      document.querySelectorAll('.star-input[value="4"]').forEach(i=>{ i.checked=true; i.dispatchEvent(new Event('change', {bubbles:true})); });
      document.getElementById('remark').value = 'ダミー出力テスト';
      const s = buildSummary();
      const prev = s.style.display; s.style.display='block';
      const ok = await ensureHtml2Pdf();
      if(!ok){ log('ライブラリ未ロード → フォールバックへ'); printSummary(); s.style.display=prev||''; return; }
      const opt={ margin:10, filename:'_dryrun.pdf', image:{type:'jpeg',quality:0.5}, html2canvas:{scale:1.5}, jsPDF:{unit:'mm',format:'a4'} };
      try{ const blob = await html2pdf().from(s).set(opt).outputPdf('blob'); log(`Blob生成OK: ${blob.size} bytes`); }
      catch(e){ log('Blob生成失敗: '+e.message); }
      s.style.display=prev||'';
      log('ドライラン終了');
    }

    function init(){
      initStarRadios();
      document.getElementById('saveBtn').addEventListener('click', saveAsPDF);
      document.getElementById('runTests').addEventListener('click', runTests);
      document.getElementById('dryRun').addEventListener('click', dryRun);
    }
    if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
  </script></body>
</html>
